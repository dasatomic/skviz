  <defs>
    <radialGradient id="poz" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3b3590"/><stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#poz)"/>
  <g font-family="Noto Color Emoji" font-size="54" opacity=".9">
