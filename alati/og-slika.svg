  <image xlink:href="../public/logo.svg" x="250" y="70" width="700" height="307"/>
  <text x="600" y="455" text-anchor="middle" font-family="Noto Sans" font-weight="700" font-size="54" fill="#ffffff">Школски квиз знања</text>
  <text x="600" y="525" text-anchor="middle" font-family="Noto Sans" font-size="32" fill="#c7c4f5">Играјте преко телефона · 5.000+ питања · 5–8. разред</text>
