name: Provera kvizova

on:
  push:
  pull_request:

jobs:
  provera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provera formata svih kvizova
        run: npm run proveri
      - name: Provera sintakse koda
        run: |
          node --check server.js
          for f in lib/*.js public/*.js alati/*.js; do node --check "$f"; done
